<!DOCTYPE html>

    <title>TCM Clinical Assistant - General Inquiry</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }


        .patient-summary {
            background: #f3f3f3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }


        .section {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }


        .section h2 {
            margin-top: 0;
        }


        label {
            display: block;
            margin-top: 10px;
        }


        textarea,
        select {
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
            padding: 8px;
            margin-top: 5px;
            font: inherit;
        }


        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }


        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 30px;
        }


        .hidden {
            display: none;
        }


        h3 {
            margin-top: 20px;
        }

    </style>

</head>

function updateSweatingQuestions() {
  const sweatingEase = document.querySelector(
    'input[name="sweatingEase"]:checked'
  )?.value || "";

  const sweatingDetails = document.getElementById("sweatingDetails");

  if (sweatingDetails) {
    sweatingDetails.classList.toggle(
      "hidden",
      sweatingEase !== "Yes, I sweat easily"
    );
  }

  const sweatingTiming = Array.from(
    document.querySelectorAll(".sweatingTiming:checked")
  ).map(checkbox => checkbox.value);

  const spontaneousDetails = document.getElementById(
    "spontaneousSweatingDetails"
  );

  if (spontaneousDetails) {
    spontaneousDetails.classList.toggle(
      "hidden",
      !sweatingTiming.includes(
        "Spontaneous sweating without obvious activity"
      )
    );
  }

  const locationType = document.querySelector(
    'input[name="sweatingLocationType"]:checked'
  )?.value || "";

  const specificLocationDetails = document.getElementById(
    "specificSweatingLocationDetails"
  );

  if (specificLocationDetails) {
    specificLocationDetails.classList.toggle(
      "hidden",
      locationType !== "Mainly one specific area" &&
      locationType !== "Both whole body and specific areas"
    );
  }
}

function updateChestAbdomenQuestions() {
    const presence = document.querySelector(
        'input[name="chestAbdomenPresence"]:checked'
    )?.value || "";

    const details = document.getElementById("chestAbdomenDetails");

    if (details) {
        details.classList.toggle("hidden", presence !== "Yes");
    }

    // If the patient does not have chest/abdominal symptoms,
    // hide all follow-up questions.
    if (presence !== "Yes") {
        document.getElementById("chestDetails")?.classList.add("hidden");
        document.getElementById("abdomenDetails")?.classList.add("hidden");
        document.getElementById("chestPainQualityDetails")?.classList.add("hidden");
        document.getElementById("abdominalWarmthDetails")?.classList.add("hidden");
        document.getElementById("abdominalPressureDetails")?.classList.add("hidden");
        return;
    }

    const location = document.querySelector(
        'input[name="chestAbdomenLocation"]:checked'
    )?.value || "";

    const showChest =
        location === "Chest" ||
        location === "Both chest and abdomen";

    const showAbdomen =
        location === "Abdomen" ||
        location === "Both chest and abdomen";

    const chestDetails = document.getElementById("chestDetails");
    const abdomenDetails = document.getElementById("abdomenDetails");

    if (chestDetails) {
        chestDetails.classList.toggle("hidden", !showChest);
    }

    if (abdomenDetails) {
        abdomenDetails.classList.toggle("hidden", !showAbdomen);
    }

    // Show chest pain quality only when
    // "Chest pain or discomfort" is selected.
    const chestPainSelected = Array.from(
        document.querySelectorAll(".chestSymptoms:checked")
    ).some(
        checkbox => checkbox.value === "Chest pain or discomfort"
    );

    const chestPainQualityDetails = document.getElementById(
        "chestPainQualityDetails"
    );

    if (chestPainQualityDetails) {
        chestPainQualityDetails.classList.toggle(
            "hidden",
            !showChest || !chestPainSelected
        );
    }

    // Show abdominal warmth/pressure questions only when
    // "Abdominal pain or discomfort" is selected.
    const abdominalPainSelected = Array.from(
        document.querySelectorAll(".abdominalSymptoms:checked")
    ).some(
        checkbox => checkbox.value === "Abdominal pain or discomfort"
    );

    const abdominalWarmthDetails = document.getElementById(
        "abdominalWarmthDetails"
    );

    const abdominalPressureDetails = document.getElementById(
        "abdominalPressureDetails"
    );

    if (abdominalWarmthDetails) {
        abdominalWarmthDetails.classList.toggle(
            "hidden",
            !showAbdomen || !abdominalPainSelected
        );
    }

    if (abdominalPressureDetails) {
        abdominalPressureDetails.classList.toggle(
            "hidden",
            !showAbdomen || !abdominalPainSelected
        );
    }
}

<script>
function clearCurrentCase() {

    const confirmed = confirm(
        "Start a new patient?\n\nAll information from the current case will be cleared."
    );

    if (!confirmed) {
        return;
    }

    localStorage.clear();

    window.location.href = "index.html";
}

/* =========================================================
   BASIC DATA FUNCTIONS
   ========================================================= */


function getData(key) {

    try {

        const rawData =
            localStorage.getItem(key);

        if (!rawData) {
            return null;
        }

        return JSON.parse(rawData);

    } catch (error) {

        return null;

    }

}


function getFirstAvailableData(keys) {

    for (const key of keys) {

        const data =
            getData(key);

        if (
            data !== null &&
            data !== undefined
        ) {

            return data;

        }

    }

    return null;

}


/* =========================================================
   EMPTY VALUE CHECK
   ========================================================= */


function isEmptyValue(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return true;

    }


    if (
        value === "Not recorded" ||
        value === "None recorded"
    ) {

        return true;

    }


    if (
        Array.isArray(value) &&
        value.length === 0
    ) {

        return true;

    }


    return false;

}


/* =========================================================
   FORMAT VALUE
   ========================================================= */


function formatValue(value) {

    if (isEmptyValue(value)) {

        return "";

    }


    if (Array.isArray(value)) {

        return value
            .filter(item => !isEmptyValue(item))
            .join(", ");

    }


    return String(value);

}


/* =========================================================
   FORMAT LABEL
   ========================================================= */


function formatLabel(key) {

    return key
        .replace(/([A-Z])/g, " $1")
        .replace(/[_-]/g, " ")
        .replace(/^./, character =>
            character.toUpperCase()
        );

}


/* =========================================================
   CREATE TABLE
   ========================================================= */


function createTable(fields) {

    const validFields =
        fields.filter(item =>
            !isEmptyValue(item.value)
        );


    if (validFields.length === 0) {

        return null;

    }


    const table =
        document.createElement("table");

    table.className =
        "field-table";


    validFields.forEach(item => {

        const row =
            document.createElement("tr");


        const label =
            document.createElement("th");

        label.textContent =
            item.label;


        const value =
            document.createElement("td");

        value.textContent =
            formatValue(item.value);


        row.appendChild(label);
        row.appendChild(value);

        table.appendChild(row);

    });


    return table;

}


/* =========================================================
   ADD SUBSECTION
   ========================================================= */


function addSubsection(
    container,
    title,
    fields
) {

    const table =
        createTable(fields);


    if (!table) {

        return false;

    }


    const subsection =
        document.createElement("div");

    subsection.className =
        "subsection";


    const heading =
        document.createElement("h3");

    heading.textContent =
        title;


    subsection.appendChild(heading);

    subsection.appendChild(table);

    container.appendChild(subsection);


    return true;

}


/* =========================================================
   ADD SECTION
   ========================================================= */


function addSection(
    container,
    number,
    title
) {

    const section =
        document.createElement("div");

    section.className =
        "section";


    const heading =
        document.createElement("h2");

    heading.textContent =
        `${number}. ${title}`;


    section.appendChild(heading);

    container.appendChild(section);


    return section;

}


/* =========================================================
   PATIENT INFORMATION
   ========================================================= */


function buildPatientSection(container, patient) {

    const section =
        addSection(
            container,
            1,
            "Patient Information"
        );


    if (!patient) {

        return;

    }


    const fields = [

        {
            label: "First Name",
            value: patient.firstName
        },

        {
            label: "Last Initial",
            value: patient.lastInitial
        },

        {
            label: "Age",
            value: patient.age
        },

        {
            label: "Sex",
            value: patient.sex
        },

        {
            label: "Date",
            value: patient.date
        },


    ];


    const table =
        createTable(fields);


    if (table) {

        section.appendChild(table);

    }

}


/* =========================================================
   CHIEF COMPLAINT
   ========================================================= */


function buildChiefComplaintSection(
    container,
    painAssessment
) {

    const section =
        addSection(
            container,
            2,
            "Chief Complaint"
        );

    const patient =
        getData("patient");

    if (!patient) {
        return;
    }

    addSubsection(
        section,
        "Main Complaint",
        [
            {
                label: "Chief Complaint",
                value: patient.chiefComplaint
            }
        ]
    );
}


/* =========================================================
   HPI / OPQRST
   ========================================================= */

function buildHPISection(
    container,
    painAssessment
) {

    const section =
        addSection(
            container,
            3,
            "History of Present Illness / OPQRST"
        );

    if (!painAssessment) {
        return;
    }


    /* =====================================================
       O — ONSET
       ===================================================== */

    addSubsection(
        section,
        "O — Onset",
        [
            {
                label: "Duration",
                value:
                    painAssessment.O &&
                    painAssessment.O.duration
            },

            {
                label: "Onset Type",
                value:
                    painAssessment.O &&
                    painAssessment.O.onsetType
            },

            {
                label: "Associated Cause / Trigger",
                value:
                    painAssessment.O &&
                    painAssessment.O.associatedCause
            }
        ]
    );


    /* =====================================================
       P — PROVOCATION / PALLIATION
       ===================================================== */

    addSubsection(
        section,
        "P — Provocation / Palliation",
        [
            {
                label: "Worse With",
                value:
                    painAssessment.P &&
                    painAssessment.P.worse
            },

            {
                label: "Better With",
                value:
                    painAssessment.P &&
                    painAssessment.P.better
            }
        ]
    );


    /* =====================================================
       Q — QUALITY
       ===================================================== */

    addSubsection(
        section,
        "Q — Quality",
        [
            {
                label: "Pain Quality",
                value:
                    painAssessment.Q &&
                    painAssessment.Q.quality
            },

            {
                label: "Other",
                value:
                    painAssessment.Q &&
                    painAssessment.Q.other
            }
        ]
    );


    /* =====================================================
       R — REGION / RADIATION
       ===================================================== */

    addSubsection(
        section,
        "R — Region / Radiation",
        [
            {
                label: "Location",
                value:
                    painAssessment.R &&
                    painAssessment.R.location
            },

            {
                label: "Radiation",
                value:
                    painAssessment.R &&
                    painAssessment.R.radiation
            },

            {
                label: "Radiation Location",
                value:
                    painAssessment.R &&
                    painAssessment.R.radiationLocation
            }
        ]
    );


    /* =====================================================
       S — SEVERITY
       ===================================================== */

    const severity =
        painAssessment.S;

    if (
        severity &&
        (
            !isEmptyValue(severity.current) ||
            !isEmptyValue(severity.best) ||
            !isEmptyValue(severity.worst)
        )
    ) {

        const severityTable =
            createTable([

                {
                    label: "Current",
                    value:
                        !isEmptyValue(severity.current)
                            ? severity.current + "/10"
                            : ""
                },

                {
                    label: "Best",
                    value:
                        !isEmptyValue(severity.best)
                            ? severity.best + "/10"
                            : ""
                },

                {
                    label: "Worst",
                    value:
                        !isEmptyValue(severity.worst)
                            ? severity.worst + "/10"
                            : ""
                }

            ]);

        if (severityTable) {

            addSubsection(
                section,
                "S — Severity",
                []
            );

            section.appendChild(
                severityTable
            );
        }
    }


    /* =====================================================
       T — TIMING
       ===================================================== */

    addSubsection(
        section,
        "T — Timing",
        [
            {
                label: "Pattern",
                value:
                    painAssessment.T &&
                    painAssessment.T.pattern
            },

            {
                label: "Episode Duration",
                value:
                    painAssessment.T &&
                    painAssessment.T.episodeDuration
            },

            {
                label: "Episode Frequency",
                value:
                    painAssessment.T &&
                    painAssessment.T.episodeFrequency
            },

            {
                label: "Worse Time",
                value:
                    painAssessment.T &&
                    painAssessment.T.worseTime
            },

            {
                label: "Development",
                value:
                    painAssessment.T &&
                    painAssessment.T.development
            }
        ]
    );
}

/* =========================================================
   MENSTRUATION
   ========================================================= */
function buildMenstruationSection(
    container,
    data,
    patient
) {

    // Do not show menstruation section for male patients
    if (
        patient &&
        String(patient.sex).toLowerCase() !== "female"
    ) {
        return;
    }

    // Do not show menstruation section if there is no data
    if (!data) {
        return;
    }

    // Do not show menstruation section if the patient selected "No"
    // for menstrual history applicability
    const applicable =
        String(data.applicable || "").toLowerCase();

    if (
        applicable === "no" ||
        applicable === "not applicable" ||
        applicable === "n/a"
    ) {
        return;
    }

    const section =
        addSection(
            container,
            6,
            "Female Health / Menstruation"
        );


    addSubsection(
        section,
        "Menstrual Status",
        [
            {

                value:
                    data.applicable
            },

            {
                label: "Menstrual Status",
                value:
                    data.menstrualStatus
            },

            {
                label: "Last Menstrual Period",
                value:
                    data.lastMenstrualPeriod
            },

            {
                label: "Menarche Age",
                value:
                    data.menarcheAge
            }
        ]
    );


    addSubsection(
        section,
        "Cycle and Bleeding",
        [
            {

        // =========================================

        // =========================================

        const worksheetPath =
            "xl/worksheets/sheet1.xml";

        const worksheetFile =
            zip.file(worksheetPath);

        if (!worksheetFile) {
            throw new Error(
                "sheet1.xml was not found."
            );
        }

        let worksheetXml =
            await worksheetFile.async("string");


        // =========================================
        // 5. HELPER FUNCTION
        //    WRITE TEXT INTO EXISTING CELL
        // =========================================

        function setCellText(
    xml,
    cellReference,
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return xml;
    }


    // Parse worksheet XML safely
    const parser =
        new DOMParser();

    const xmlDoc =
        parser.parseFromString(
            xml,
            "application/xml"
        );


    // Check for XML parsing errors
    const parserError =
        xmlDoc.querySelector(
            "parsererror"
        );

    if (parserError) {

        throw new Error(
            "Unable to parse worksheet XML."
        );

    }


    // Find the target cell
    const cells =
        xmlDoc.getElementsByTagName("c");

    let targetCell = null;


    for (
        let i = 0;
        i < cells.length;
        i++
    ) {

        if (
            cells[i].getAttribute("r")
            === cellReference
        ) {

            targetCell =
                cells[i];

            break;

        }

    }


    if (!targetCell) {

        console.warn(
            "Cell not found:",
            cellReference
        );

        return xml;

    }


    // Remove existing cell value/content
    while (
        targetCell.firstChild
    ) {

        targetCell.removeChild(
            targetCell.firstChild
        );

    }


    // Change cell type to inline string
    targetCell.setAttribute(
        "t",
        "inlineStr"
    );


    // Create:
    // <is><t xml:space="preserve">VALUE</t></is>

    const namespace =
        xmlDoc.documentElement
            .namespaceURI;


    const inlineString =
        xmlDoc.createElementNS(
            namespace,
            "is"
        );


    const textElement =
        xmlDoc.createElementNS(
            namespace,
            "t"
        );


    textElement.setAttributeNS(
        "http://www.w3.org/XML/1998/namespace",
        "xml:space",
        "preserve"
    );


    textElement.textContent =
        String(value);


    inlineString.appendChild(
        textElement
    );


    targetCell.appendChild(
        inlineString
    );


    // Convert XML DOM back to text
    const serializer =
        new XMLSerializer();


    return serializer.serializeToString(
        xmlDoc
    );

}

function buildPulseRow(property) {

    const parts = [];

    Object.entries(
        pulsePositionLabels
    ).forEach(([key, label]) => {

        const value =
            pulsePositions[key]?.[property];

        if (
            value !== null &&
            value !== undefined &&
            String(value).trim() !== ""
        ) {

            parts.push(
                label +
                ": " +
                String(value).trim()
            );

        }

    });

    return parts.join("; ");
}

// =========================================
// ANALYZE WITH CHATGPT
// =========================================

async function analyzeWithChatGPT() {

    // Get the visible Case Summary
    const summaryContainer =
        document.getElementById(
            "caseSummary"
        );

    if (!summaryContainer) {

        alert(
            "Unable to find the Case Summary."
        );

        return;
    }


    const caseText =
        summaryContainer.innerText.trim();


    if (!caseText) {

        alert(
            "The Case Summary is empty."
        );

        return;
    }


    const prompt =
`The following is a TCM clinical case.

${caseText}

Based on the information above, provide a concise TCM clinical analysis.

Please provide:

1. TCM Disease Diagnosis

2. Syndrome Differentiation

3. Etiology / Pathogenesis
Keep this brief and clinically focused.

4. Treatment Principle

5. Acupuncture Points
Give the main points first.
Add only necessary supplementary points.
Briefly explain the point selection.

Keep the answer concise and practical.
Do not repeat the entire case history.`;



    try {

        await navigator.clipboard.writeText(
            prompt
        );


        alert(
            "The case has been copied. ChatGPT will now open. Paste the case into ChatGPT and send it."
        );


        window.open(
            "https://chatgpt.com/",
            "_blank"
        );

    }

    catch (error) {

        console.error(
            "Clipboard error:",
            error
        );


        alert(
            "Unable to copy the case to the clipboard."
        );

    }

}
